<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Diorama · 方寸之间</title>
<style>
:root { color-scheme:dark; background:#0d151c; color:#f1e8d8; font-family:system-ui,sans-serif }
* { box-sizing:border-box }
body { margin:0; background:radial-gradient(ellipse at 75% 0,#1f2b33,transparent 670px) }
main { max-width:1180px; margin:auto; padding:72px 24px }
header { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:37px }
h1 { margin:0; font:500 clamp(3.2rem,10vw,6.6rem)/.95 Georgia,serif; letter-spacing:-.05em }
header p { margin:0 0 14px; color:#dec29b; letter-spacing:.14em }
a { color:inherit; text-decoration:none }
a:focus-visible { outline:2px solid #e6c198; outline-offset:4px }
.film { padding:12px 16px; white-space:nowrap; border:1px solid #756451; border-radius:4px }
.film:hover { background:#40362c }
.gallery { display:grid; gap:25px; grid-template-columns:repeat(3,minmax(0,1fr)) }
.scene { background:#15202a; border:1px solid #31404c; border-radius:7px; overflow:hidden }
.scene:hover { border-color:#cdab84 }
.scene img { width:100%; aspect-ratio:4/3; object-fit:contain; display:block; background:#121a22; image-rendering:pixelated }
.scene h2 { margin:15px 16px 4px; font-size:1.12rem }
.scene p { color:#c4c8c7; margin:0 16px 17px; font-size:.92rem }
@media(max-width:820px) { .gallery { grid-template-columns:repeat(2,minmax(0,1fr)) } }
@media(max-width:490px) { main { padding:40px 16px } header { align-items:start; flex-direction:column }
.gallery { grid-template-columns:1fr } }
</style>
<body>
<main>
  <header>
    <div><p>方寸之间</p><h1>Pixel Diorama</h1></div>
    <a class="film" href="../media/pixel-diorama-nine-worlds.mp4">观看宣传片 ↗</a>
  </header>
  <section class="gallery" aria-label="九个 3D 像素场景">
    <a class="scene" href="emberfall-volcano.html">
      <img loading="lazy" src="emberfall-volcano.png" alt="">
      <h2>余烬火山</h2>
      <p>熔岩、灰烬与烟柱</p>
    </a>
    <a class="scene" href="pyramid-ruins.html">
      <img loading="lazy" src="pyramid-ruins.png" alt="">
      <h2>金字塔遗迹</h2>
      <p>石阶、狮身人面像与绿洲</p>
    </a>
    <a class="scene" href="machu-picchu.html">
      <img loading="lazy" src="machu-picchu.png" alt="">
      <h2>马丘比丘</h2>
      <p>山脊、梯田与山雾</p>
    </a>
    <a class="scene" href="cedar-spring-explore.html">
      <img loading="lazy" src="cedar-spring-explore.png" alt="">
      <h2>雪松温泉</h2>
      <p>雪松、泉雾与可操控角色</p>
    </a>
    <a class="scene" href="dinosaur-valley.html">
      <img loading="lazy" src="dinosaur-valley.png" alt="">
      <h2>侏罗纪河谷</h2>
      <p>异特龙饮水、两级瀑布与涟漪</p>
    </a>
    <a class="scene" href="crab-island.html">
      <img loading="lazy" src="crab-island.png" alt="">
      <h2>断潮岛</h2>
      <p>巨蟹、潮涌与挑战者</p>
    </a>
    <a class="scene" href="eiffel-paris.html">
      <img loading="lazy" src="eiffel-paris.png" alt="">
      <h2>巴黎夜色</h2>
      <p>铁塔、河岸与夜间照明</p>
    </a>
    <a class="scene" href="ash-gate.html">
      <img loading="lazy" src="ash-gate.png" alt="">
      <h2>灰钟关</h2>
      <p>灰钟、火光与可操控的守关人</p>
    </a>
    <a class="scene" href="bone-dragon-awakens.html">
      <img loading="lazy" src="bone-dragon-awakens.png" alt="">
      <h2>骨龙苏醒</h2>
      <p>骨架关节与展翼动画</p>
    </a>
  </section>
</main>
</body>
</html>
