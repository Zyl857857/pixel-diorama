<title>巴黎 · 塞纳河蓝调</title>
<style>
:root{color-scheme:dark;background:#141c31;color:#e1eceb;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center}
main{width:min(100%,960px);padding:22px 22px 20px}
header{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 auto;width:100%;max-width:780px}
h1{font-size:clamp(1.1rem,3.4vw,1.65rem);font-weight:570;letter-spacing:.09em;margin:0}
#view{position:relative;width:100%;margin:0 auto;max-width:840px;aspect-ratio:4/3;overflow:hidden}
canvas,#poster{width:100%;height:100%;image-rendering:pixelated;display:block}
canvas{outline:none;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
canvas:focus-visible{outline:2px solid #92babc;outline-offset:-4px}
#poster{position:absolute;inset:0;pointer-events:none}
#poster[hidden]{display:none}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;margin:auto;max-width:780px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{background:#192632;border:1px solid #314653;color:#e1eceb;border-radius:7px;min-height:38px;padding:0 13px;font:inherit;font-size:.83rem;cursor:pointer}
button:hover{background:#243640}button:focus-visible{outline:2px solid #9cc5c6;outline-offset:2px}
button:disabled{opacity:.42;cursor:default}
#walk-pad{display:none}
@media (pointer:coarse){
  #walk-pad:not([hidden]){position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,44px);gap:4px;touch-action:none}
  #walk-pad button{min-height:44px;padding:0;background:#192632e8}
  #walk-pad button:first-child{grid-column:2}
  #walk-pad button:nth-child(2){grid-column:1}
}
#hint{margin:0;color:#a3b7bd;font-size:.77rem}
@media (max-width:600px){main{padding:18px 12px 24px}}
</style>

<script>
'use strict';

const walking=null;

const canvas = document.getElementById('canvas');
const poster = document.getElementById('poster');
const toggle = document.getElementById('toggle');
const reset = document.getElementById('reset');
const hint = document.getElementById('hint');
const scene=JSON.parse(document.getElementById('scene').textContent);
const labels=scene.labels;
const width = canvas.width, height = canvas.height;
const TAU = Math.PI * 2;
const POINTS_PER_ROW = 256;

const splatVertex = `#version 300 es
precision highp float;
precision highp int;
in uint slot;
uniform sampler2D geometry;
uniform vec3 right, up, target;
uniform vec2 grid;
uniform float scale;
uniform int mirror;
uniform float waterLevel;
out vec2 pixelShift;
flat out vec3 ellipse, tint;
flat out float opacity, type;
flat out vec2 surface;
const vec2 corners[4] = vec2[](vec2(-1.,-1.),vec2(1.,-1.),vec2(-1.,1.),vec2(1.,1.));

void main() {
  int i = int(slot);
  ivec2 cell = ivec2((i & 255) * 3, i >> 8);
  vec4 p = texelFetch(geometry, cell, 0);
  vec4 a = texelFetch(geometry, cell + ivec2(1,0), 0);
  vec4 b = texelFetch(geometry, cell + ivec2(2,0), 0);
  type = b.w;
  opacity = p.w;
  surface = p.xz;
  float rgb = a.w;
  tint = vec3(mod(rgb, 256.),mod(floor(rgb/256.),256.),floor(rgb/65536.)) / 255.;
  if (mirror == 1 && (p.y <= waterLevel + .005 || type > .5)) {
    gl_Position = vec4(0.,0.,2.,1.);
    return;
  }
  vec3 r = right;
  vec3 u = up;
  if (mirror == 1) {
    p.y = 2. * waterLevel - p.y;
    r.y = -r.y;
    u.y = -u.y;
  }
  mat3 covariance = mat3(a.x,a.y,a.z, a.y,b.x,b.y, a.z,b.y,b.z);
  vec3 cr = covariance * r;
  vec3 cu = covariance * u;
  float q = scale * scale;
  float xx = max(.14, dot(cr, r) * q + .14);
  float yy = max(.14, dot(cu, u) * q + .14);
  float xy = dot(cr, u) * q;
  float d = max(.0001, xx*yy - xy*xy);
  ellipse = vec3(yy,-xy,xx)/d;
  pixelShift = corners[gl_VertexID] * 3.05 * sqrt(vec2(xx,yy));
  vec3 pos = p.xyz - target;
  vec2 center = vec2(dot(right,pos),dot(up,pos))*scale;
  gl_Position = vec4(2.0 * (center + pixelShift) / grid,0.,1.);
}
`;
const splatFragment = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D reflections;
uniform vec2 grid;
uniform float phase, reflectionGain;
uniform vec2 rippleA, rippleB;
uniform vec3 waterDark, waterLight;
uniform int mirror;
in vec2 pixelShift;
flat in vec3 ellipse,tint;
flat in float opacity,type;
flat in vec2 surface;
out vec4 paint;

void main() {
  float power = dot(pixelShift*pixelShift,ellipse.xz) +
    2.0 * pixelShift.x * pixelShift.y * ellipse.y;
  if (power > 9.0) discard;
  float weight = opacity * exp(-.5 * power);
  float alpha = opacity >= 1.0 && (type < .5 || type > 3.5) ? .99 * smoothstep(.38,.62,weight) : min(.94,weight);
  if (alpha < .008) discard;
  vec3 color = tint;
  if (type > .5 && type < 1.5 && mirror == 0) {
    vec2 p = surface;
    float d1=length(p-rippleA), d2=length(p-rippleB);
    float waveA=cos(13.4*d1-phase*4.0), waveB=cos(11.2*d2-phase*3.0);
    float a=waveA*exp(-2.5*d1*d1), b=waveB*exp(-1.7*d2*d2);
    vec2 distortion = vec2(a,b)*1.50;
    vec4 reflected = texture(reflections,(gl_FragCoord.xy + distortion)/grid);
    vec3 water = mix(waterDark,waterLight,.52 + .14*a + .09*b + .07*sin(p.x*1.7+p.y*2.1));
    water = mix(water,tint,.24);
    float rings = .64*smoothstep(.26,.86,a) + .36*smoothstep(.26,.82,b);
    color = mix(water,waterLight,rings*.36);
    color = color * (1.0 - reflected.a*reflectionGain) + reflected.rgb*reflectionGain;
    alpha = min(.9,1.28*alpha);
  }
  paint = vec4(color,alpha);
}
`;
const resolveVertex = `#version 300 es
void main() {
  const vec2 p[3]=vec2[](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
  gl_Position=vec4(p[gl_VertexID],0.,1.);
}
`;
const resolveFragment = `#version 300 es
precision highp float;
uniform sampler2D image;
uniform vec3 palette[72];
uniform int colors;
out vec4 pixel;
void main() {
  vec3 source=texelFetch(image,ivec2(gl_FragCoord.xy),0).rgb;
  vec3 best=source;
  float closest=4.0;
  for (int i=0;i<72;i++) {
    if (i>=colors) break;
    vec3 d=source-palette[i];
    float score=dot(d*d,vec3(1.,1.12,.90));
    if (score<closest) { closest=score; best=palette[i]; }
  }
  pixel=vec4(mix(best,source,.12),1.);
}
`;

function program(gl, vertex, fragment) {
  const handle = gl.createProgram();
  for (const [code, kind] of [[vertex, gl.VERTEX_SHADER], [fragment, gl.FRAGMENT_SHADER]]) {
    const shader = gl.createShader(kind);
    gl.shaderSource(shader, code);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    gl.attachShader(handle, shader);
    gl.deleteShader(shader);
  }
  gl.linkProgram(handle);
  if (!gl.getProgramParameter(handle, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(handle));
  return handle;
}

function texture(gl, w, h, format, data) {
  const handle = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, handle);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, format, w, h, 0, gl.RGBA,
    format === gl.RGBA32F ? gl.FLOAT : gl.UNSIGNED_BYTE, data);
  return handle;
}

function framebuffer(gl) {
  const pixels = texture(gl,width,height,gl.RGBA8,null);
  const handle = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, handle);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pixels, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
    throw new Error('Cannot create the pixel framebuffer');
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {handle,pixels};
}

async function readGeometry(base64) {
  const binary = atob(base64);
  const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Float32Array(await new Response(stream).arrayBuffer());
}

function createRenderer(gl, scene, shape) {
  const staticCount = scene.count;
  const effect = scene.effect || {};
  const water = scene.water;
  const flakes = effect.type ? (effect.count ?? 48) : 0;
  const wisps = water?.steam ? 100 : 0;
  const rgb = p => [(p>>16&255)/255,(p>>8&255)/255,(p&255)/255];
  const heroStart=staticCount+flakes+wisps;
  const count = heroStart + (scene.walk ? scene.avatar.length+1 : 0);
  const rows = Math.ceil(count/POINTS_PER_ROW);
  const geometry = new Float32Array(rows*POINTS_PER_ROW*12);
  geometry.set(shape);
  const images = { reflection: framebuffer(gl), color: framebuffer(gl) };
  const shapeTex = texture(gl,POINTS_PER_ROW*3,rows,gl.RGBA32F,geometry);
  const firstDynamicRow = Math.floor(staticCount/POINTS_PER_ROW);
  const dynamicRows = geometry.subarray(firstDynamicRow*POINTS_PER_ROW*12);

  const splat = program(gl,splatVertex,splatFragment);
  const resolve = program(gl,resolveVertex,resolveFragment);
  const uniforms = Object.fromEntries(['right','up','target','grid','scale','mirror','phase','geometry','reflections','waterLevel','reflectionGain','rippleA','rippleB','waterDark','waterLight']
    .map(name => [name,gl.getUniformLocation(splat,name)]));
  const sortBuffer = gl.createBuffer();
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,sortBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,count*4,gl.DYNAMIC_DRAW);
  const index = gl.getAttribLocation(splat,'slot');
  gl.enableVertexAttribArray(index);
  gl.vertexAttribIPointer(index,1,gl.UNSIGNED_INT,0,0);
  gl.vertexAttribDivisor(index,1);
  const resolveVao = gl.createVertexArray();

  const colors = new Float32Array(72*3);
  const palette = scene.palette;
  palette.forEach((p,i) => colors.set([(p>>16&255)/255,(p>>8&255)/255,(p&255)/255],i*3));
  gl.useProgram(resolve);
  gl.uniform3fv(gl.getUniformLocation(resolve,'palette[0]'),colors);
  gl.uniform1i(gl.getUniformLocation(resolve,'colors'),palette.length);
  gl.uniform1i(gl.getUniformLocation(resolve,'image'),0);
  gl.viewport(0,0,width,height);
  gl.disable(gl.DEPTH_TEST);
  gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

  const order = new Uint32Array(count);
  const buckets = new Uint32Array(1024);
  const perPoint = new Uint16Array(count);
  const hash = x => {
    const value=Math.sin(x * 127.1 + 3.7)*43758.5453;
    return value-Math.floor(value);
  };
  const pack = (r,g,b) => r+256*g+65536*b;
  function add(index,x,y,z,opacity,sx,sy,sz,tint,type=2) {
    const row = index*12;
    geometry.set([x,y,z,opacity,sx*sx,0,0,tint,sy*sy,0,sz*sz,type],row);
  }
  const particleInk=pack(...rgb(effect.color ?? 0xa5bdc8).map(v=>Math.round(v*255)));
  function animated(time) {
    const f = time/8;
    const [sx,sz] = effect.radius ?? [5,3.5];
    for (let i=0;i<flakes;i++) {
      const start=hash(i+1);
      const vertical=(hash(i+112)+f*(effect.type==='rain'?3:1))%1;
      const dust=effect.type==='dust', rain=effect.type==='rain';
      if(effect.type==='mist'){
        const fog=effect.origins ?? [[0,.12,0]];
        const [ox,oy,oz]=fog[i%fog.length];
        const life=(start+f)%1;
        const spread=.22+life*.33;
        const alpha=(effect.opacity ?? .09)*Math.sin(Math.PI*life)**2;
        add(staticCount+i,ox+(life-.5)*2.3+(hash(i+212)-.5)*1.6,
          oy+.24*hash(i+311)+.13*life,oz+(hash(i+411)-.5)*1.55,
          alpha,spread,.075+.09*life,spread*.72,particleInk);
        continue;
      }
      const drift=dust?(start+f)%1:start;
      const x=(drift-.5)*sx*2, z=(hash(i+203)-.5)*sz*2;
      const alpha=(effect.opacity ?? .5)*Math.sin(Math.PI*(dust?drift:vertical))**2;
      add(staticCount+i,x+(rain?.34:.56)*(.5-vertical),
        dust?.1+hash(i+34)*1.4+.22*Math.sin(f*TAU):4.5*(1-vertical)-.2,z,
        alpha,.022,rain?.092:.023,.020,particleInk);
    }
    const origins=water?.steamOrigins ?? [];
    for (let i=0;i<wisps;i++) {
      const [x,z]=origins[i%origins.length];
      const p=(f*2+hash(i+311))%1;
      const a=hash(i+712)*TAU, r=(.08+p*.33)*hash(i+480);
      const sx=.075+.115*p;
      add(staticCount+flakes+i,
        x+.46*p+Math.cos(a)*r+.16*Math.sin(p*7+f*TAU),
        water.level+.03+p*.96,
        z+Math.sin(a)*r*.8,
        .10*Math.sin(p*Math.PI)**2,sx,.057+.06*p,sx,pack(171,199,203));
    }
  }
  function sort(eye, mirrored) {
    buckets.fill(0);
    let n=0;
    const sign = mirrored ? -1 : 1;
    for (let i=0;i<(mirrored?staticCount:count);i++) {
      const q=i*12;
      if (mirrored && (geometry[q+1]<=water.level+.005 || geometry[q+11]>.5)) {
        perPoint[i]=65535;
        continue;
      }
      const d=geometry[q]*eye[0]+geometry[q+1]*eye[1]*sign+geometry[q+2]*eye[2];
      const key=Math.max(0,Math.min(1023,Math.floor((d+10)*51.2)));
      perPoint[i]=key;
      buckets[key]++;
    }
    for (let i=0;i<buckets.length;i++) {
      const size=buckets[i];
      buckets[i]=n;
      n+=size;
    }
    for (let i=0;i<(mirrored?staticCount:count);i++) {
      const k=perPoint[i];
      if (k<1024) order[buckets[k]++]=i;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,sortBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,order,0,n);
    return n;
  }

  return (yaw,pitch,zoom,time,hero) => {
    animated(time);
    if(scene.walk){
      const model=scene.avatar;
      if(!hero){
        for(let j=0;j<=model.length;j++)geometry[(heroStart+j)*12+3]=0;
      }else{
        const cy=Math.cos(hero.facing),sy=Math.sin(hero.facing);
        const stride=hero.moving?Math.sin(hero.travel*12.8):0;
        const bounce=Math.abs(stride)*.035;
        add(heroStart,hero.x,hero.y+.025,hero.z,.32,.127,.010,.10,pack(26,34,41));
        for(let j=0;j<model.length;j++){
          const [x,y,z,color,part]=model[j];
          // Compiled part IDs are body, head, two arms, then two legs.
          const sign=part%2 ? 1 : -1;
          const swing=stride*sign*(part>=4?.105:part>=2?-.085:0);
          const localX=x*.054,localZ=z*.054+swing;
          const localY=(y+.58)*.054+(part>=4?Math.max(0,swing)*.45:bounce);
          const tone=pack(color>>16&255,color>>8&255,color&255);
          add(heroStart+j+1,hero.x+localX*cy+localZ*sy,hero.y+localY,
            hero.z-localX*sy+localZ*cy,1.53,.031,.031,.031,tone,4);
        }
      }
    }
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,shapeTex);
    gl.texSubImage2D(gl.TEXTURE_2D,0,0,firstDynamicRow,POINTS_PER_ROW*3,
      rows-firstDynamicRow,gl.RGBA,gl.FLOAT,dynamicRows);
    const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
    const eye=[cp*sy,sp,cp*cy];
    gl.useProgram(splat);
    gl.bindVertexArray(vao);
    gl.uniform1i(uniforms.geometry,0);
    gl.uniform1i(uniforms.reflections,1);
    gl.uniform1f(uniforms.waterLevel,water?.level ?? 0);
    gl.uniform1f(uniforms.reflectionGain,water?.reflection ?? 0);
    gl.uniform2fv(uniforms.rippleA,water?.rippleA ?? [0,0]);
    gl.uniform2fv(uniforms.rippleB,water?.rippleB ?? [1,1]);
    gl.uniform3fv(uniforms.waterDark,rgb(water?.dark ?? 0x225960));
    gl.uniform3fv(uniforms.waterLight,rgb(water?.light ?? 0x92c8c5));
    gl.uniform3f(uniforms.right,cy,0,-sy);
    gl.uniform3f(uniforms.up,-sy*sp,cp,-cy*sp);
    gl.uniform3fv(uniforms.target,scene.camera.target);
    gl.uniform2f(uniforms.grid,width,height);
    gl.uniform1f(uniforms.scale,zoom*height/(2*scene.camera.dist*Math.tan(19*Math.PI/180)));
    gl.uniform1f(uniforms.phase,time/8*TAU);
    gl.enable(gl.BLEND);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D,images.color.pixels);
    gl.bindFramebuffer(gl.FRAMEBUFFER,images.reflection.handle);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1i(uniforms.mirror,1);
    if (water?.reflection) gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,sort(eye,true));

    gl.bindTexture(gl.TEXTURE_2D,images.reflection.pixels);
    gl.bindFramebuffer(gl.FRAMEBUFFER,images.color.handle);
    gl.clearColor(...rgb(scene.background),1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1i(uniforms.mirror,0);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,sort(eye,false));

    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.useProgram(resolve);
    gl.bindVertexArray(resolveVao);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,images.color.pixels);
    gl.disable(gl.BLEND);
    gl.drawArrays(gl.TRIANGLES,0,3);
  };
}

async function start() {
  const shape=await readGeometry(scene.data);
  if (shape.length !== scene.count*12) throw new Error('Scene data size mismatch');
  const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});
  if (!gl) throw new Error('WebGL 2 unavailable');
  const draw=createRenderer(gl,scene,shape);
  const home=scene.camera;
  let yaw=home.yaw,pitch=home.pitch,zoom=1,time=0;
  let manual=false, playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
  let previous=0, pointer=null, exploring=false;
  let hero=scene.walk?walking.spawn(scene.walk):null;
  const explore=document.getElementById('explore');
  const pad=document.getElementById('walk-pad');
  const pressed=new Set();
  const direction={w:'w',a:'a',s:'s',d:'d',arrowup:'w',arrowleft:'a',arrowdown:'s',arrowright:'d'};
  const clamp=(value,low,high)=>Math.min(high,Math.max(low,value));
  const paint=()=>draw(yaw+(!manual ? .26*Math.sin(time/8*TAU) : 0),pitch,zoom,time,exploring?hero:null);
  paint();
  poster.hidden=true;
  hint.textContent=labels.controls;
  toggle.disabled=reset.disabled=false;
  if(scene.walk){
    explore.hidden=false;
    explore.textContent=labels.enter;
    explore.setAttribute('aria-pressed','false');
    explore.addEventListener('click',()=>{
      if(!manual)yaw+=.26*Math.sin(time/8*TAU);
      manual=true;
      exploring=!exploring;
      pressed.clear();
      explore.textContent=exploring?labels.leave:labels.enter;
      explore.setAttribute('aria-pressed',String(exploring));
      pad.hidden=!exploring;
      hint.textContent=exploring?(matchMedia('(pointer:coarse)').matches?labels.touchWalk:labels.walking):labels.controls;
      if(exploring)canvas.focus({preventScroll:true});
      paint();
    });
    const key=e=>direction[e.key.toLowerCase()];
    window.addEventListener('keydown',e=>{
      if(!exploring||e.ctrlKey||e.metaKey||e.altKey||!key(e))return;
      e.preventDefault();
      pressed.add(key(e));
    });
    window.addEventListener('keyup',e=>pressed.delete(key(e)));
    window.addEventListener('blur',()=>pressed.clear());
    document.addEventListener('visibilitychange',()=>{if(document.hidden)pressed.clear();});
    for(const button of pad.querySelectorAll('button')){
      button.addEventListener('pointerdown',e=>{
        e.preventDefault();
        button.setPointerCapture(e.pointerId);
        pressed.add(button.dataset.walk);
      });
      for(const event of ['pointerup','pointercancel','lostpointercapture']){
        button.addEventListener(event,()=>pressed.delete(button.dataset.walk));
      }
    }
  }
  const label=()=>{toggle.textContent=playing?labels.pause:labels.play;};
  label();
  toggle.addEventListener('click',()=>{ playing=!playing; label(); });
  reset.addEventListener('click',()=>{
    yaw=home.yaw;
    pitch=home.pitch;
    zoom=1;
    time=0;
    manual=exploring;
    if(scene.walk)hero=walking.spawn(scene.walk);
    paint();
  });
  canvas.addEventListener('pointerdown',e=>{
    if (pointer) return;
    if (!manual) yaw+=.26*Math.sin(time/8*TAU);
    manual=true;
    pointer={id:e.pointerId,x:e.clientX,y:e.clientY};
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove',e=>{
    if (!pointer || pointer.id!==e.pointerId) return;
    yaw-=(e.clientX-pointer.x)*.008;
    pitch=clamp(pitch+(e.clientY-pointer.y)*.006,.15,1.36);
    pointer.x=e.clientX;
    pointer.y=e.clientY;
    paint();
  });
  for (const type of ['pointerup','pointercancel','lostpointercapture']) {
    canvas.addEventListener(type,e=>{if(pointer?.id===e.pointerId)pointer=null;});
  }
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    zoom=clamp(zoom*Math.exp(-e.deltaY*.0009),.73,1.62);
    paint();
  },{passive:false});
  canvas.addEventListener('keydown',e=>{
    if(exploring&&direction[e.key.toLowerCase()])return;
    const delta={ArrowLeft:[-.13,0],ArrowRight:[.13,0],ArrowUp:[0,.09],ArrowDown:[0,-.09]}[e.key];
    if (!delta && !['+','=','-'].includes(e.key)) return;
    e.preventDefault();
    if (delta) {
      if (!manual) yaw+=.26*Math.sin(time/8*TAU);
      manual=true;
      yaw+=delta[0];
      pitch=clamp(pitch+delta[1],.15,1.36);
    } else zoom=clamp(zoom*(e.key==='-'?.90:1.11),.73,1.62);
    paint();
  });
  canvas.addEventListener('webglcontextlost',()=>{
    playing=false;
    poster.hidden=false;
    toggle.disabled=reset.disabled=explore.disabled=true;
    exploring=false;
    pad.hidden=true;
    hint.textContent=labels.lost;
  });
  function animate(now) {
    const dt=now-previous;
    if (dt>=(exploring?30:55) || !previous) {
      if(previous&&!document.hidden){
        if(playing)time=(time+Math.min(dt,120)/1000)%8;
        const wasMoving=hero?.moving;
        if(exploring)walking.step(scene.walk,hero,
          Number(pressed.has('d'))-Number(pressed.has('a')),
          Number(pressed.has('w'))-Number(pressed.has('s')),yaw,dt/1000);
        if(playing||exploring&&(hero.moving||wasMoving))paint();
      }
      previous=now;
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}
start().catch(error=>{
  console.warn(error.message);
  hint.textContent=labels.fallback;
});
</script>
</body>
